name: Auto Notify Cron Job

on:
  schedule:
    # Chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Bấm chạy thử thủ công bất cứ lúc nào

jobs:
  run-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Mở trình duyệt ảo truy cập notify.php
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              console.log("Đang truy cập notify.php...");
              const response = await page.goto("https://vf3bmtadmin.free.nf/notify.php", { 
                waitUntil: "networkidle", 
                timeout: 60000 
              });
              console.log("Mã HTTP:", response ? response.status() : "N/A");
              const content = await page.textContent("body");
              console.log("Kết quả từ server:\n" + content);
              await browser.close();
            })();
          '
