name: Auto Notify Cron Job

on:
  schedule:
    # Chạy mỗi 30 phút một lần (hoặc đổi '*/15 * * * *' cho 15 phút)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thử thủ công bất cứ lúc nào

jobs:
  run-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Chạy trình duyệt ảo truy cập notify.php
        run: |
          npx -y playwright install --with-deps chromium
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              console.log("Đang truy cập notify.php...");
              await page.goto("https://vf3bmtadmin.free.nf/notify.php", { waitUntil: "networkidle", timeout: 60000 });
              const content = await page.textContent("body");
              console.log("Kết quả từ server:\n", content);
              await browser.close();
            })();
          '
